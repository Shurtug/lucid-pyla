# Retried 2026-07-31 after an AMD driver update (32.0.31035.1003, dated
# 24.07.2026 - the crashes were on the driver before it). A 60s DirectML
# stress run with BlueStacks up did 27,220 inferences at 2.2ms mean with no
# crash, where the old driver died within ~20s. Note that run did NOT include
# scrcpy streaming, so this is a trial under the real thing.
# If the bot dies with no Python traceback (exit 139 / silent exit) within the
# first minute, the driver problem is back: set this to "cpu" and it's fixed.
cpu_or_gpu = "gpu"
gpu_device_id = 0
max_ips = "auto"
pipeline_inference = true
scrcpy_max_width = 1280
scrcpy_bitrate = 4000000
trophies_multiplier = 1
run_for_minutes = 0
emulator_port = 5037
api_base_url = "default"
brawl_stars_package = "com.supercell.brawlstars"
ocr_scale_down_factor = 0.8
used_threads = 4
player_tag = "#"
brawlstars_api_key = ""
use_royaleapi_proxy = false
default_trophy_target = 1000
auto_load_queue_on_startup = true
play_order = "in_order"
